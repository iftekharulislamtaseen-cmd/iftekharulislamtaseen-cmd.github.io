<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body class="bg-black">
        <div class="flex pt-120 items-center flex-col">
            <div><h3 class="font-bold text-[22px] text-white pb-30">Dimensional Weight Calculator</h3></div>
            <div class="bg-red-600 py-40 px-20 w-400 flex flex-col gap-20 items-center rounded-2xl">
                <!-- length -->
                 <input class="[appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none py-10 px-10 border-2 border-blue-700 outline-none rounded-br15 w-340 text-white placeholder:text-white" type="number" name="" id="length" placeholder="Enter Your length">
                <!-- height -->
                 <label class="font-semibold text-[18px] text-white" for="">Height</label>
                <input class="[appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none py-10 px-10 border-2 border-blue-700 outline-none rounded-br15 w-340 text-white placeholder:text-white" type="number" name="" id="height" placeholder="Enter Your Height">
                <!-- width -->
                 <label class="font-semibold text-[18px] text-white" for="">width</label>
                 <input class="[appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none py-10 px-10 border-2 border-blue-700 outline-none rounded-br15 w-340 text-white placeholder:text-white" type="number" name="" id="width" placeholder="Enter Your width">
                 <button class="py-10 px-10 bg-blue-500 w-[50%] rounded-3xl text-[18px]" onclick="SubmitValue()" class="">Submit</button>
                 <div class="font-black text-[16px] text-white" id="result" class=""></div>
            </div>
        </div>
        <script>
            const height = document.getElementById("height")
            const width = document.getElementById("width")
            const result = document.getElementById("result")
            const length = document.getElementById("length")

            function SubmitValue(){
                if(height.value === "" || width.value === "" || length.value === ""){
                    result.innerHTML = `<span>please input number</span>`;
                    return;
                }

                let lvalue = length.value
                let hvalue = height.value
                let wvalue = width.value
                let LengthDivisor = 5000

                const results = ((lvalue* hvalue * wvalue) / LengthDivisor);

                result.innerHTML = `<span> result is : ${results}`;

                    if(results){
                        height.value = ""
                        width.value = ""
                        length.value = ""
                    }
            }
        </script>
</body>
</html>
