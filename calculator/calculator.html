<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Pocket Calculator</title>
    <link rel="stylesheet" href="src/caloutput.css">
  </head>
  <body class="flex justify-center items-center pt-150 bg-black">

    <div class="calculator w-400 bg-blue-300 px-30 py-30 flex flex-col gap-10 items-center rounded-3xl">
      <input class="text-right w-310 py-15 pr-20 border-2 border-blue-900 outline-none" type="text" id="display" value="0" readonly />

      <div class="buttons flex flex-wrap gap-y-10 gap-x-10 justify-center">
        <button class="btn" onclick="clearDisplay()">C</button>
        <button class="btn" onclick="setOperator('/')">÷</button>
        <button class="btn" onclick="setOperator('*')">×</button>
        <button class="btn" onclick="setOperator('-')">-</button>

        <button class="btn" onclick="appendNumber('7')">7</button>
        <button class="btn" onclick="appendNumber('8')">8</button>
        <button class="btn" onclick="appendNumber('9')">9</button>
        <button class="btn" onclick="setOperator('+')">+</button>

        <button class="btn" onclick="appendNumber('4')">4</button>
        <button class="btn" onclick="appendNumber('5')">5</button>
        <button class="btn" onclick="appendNumber('6')">6</button>
        <button class="btn" onclick="calculate()">=</button>

        <button class="btn" onclick="appendNumber('1')">1</button>
        <button class="btn" onclick="appendNumber('2')">2</button>
        <button class="btn" onclick="appendNumber('3')">3</button>

        <button class="btn" onclick="appendNumber('0')" style="grid-column: span 3;">0</button>
      </div>
    </div>

    <script>
      const display = document.getElementById("display")

      function appendNumber(num){
        if (display.value === "0"){
           display.value = num
        } else {
           display.value += num
        }
         
      }

      function setOperator(op){
        display.value += op
      }
      
      function calculate(){
        try{
        display.value = eval(display.value);
        } catch {
          display.value = `error`
        }
      
        if(display.value === "error"){
          display.value = 0
        }

      }
       
      function clearDisplay(){
        display.value = ""
        if(display.value === ""){
          display.value = 0
        }
      }

    </script>
  </body>
</html>
