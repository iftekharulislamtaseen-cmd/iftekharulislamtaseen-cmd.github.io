<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="src/output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="flex justify-center items-center min-h-screen bg-black">
    <div class="bg-red-500 max-w-400 w-full py-2 px-2 rounded-md">
      <div class="bg-black max-w-400 w-full flex flex-col ga-20 px-30 py-30 rounded-md ">
        <h3 class="font-semibold text-white flex justify-center pb-20">TO-Do</h3>
        <input
          class="border border-blue-600 rounded-sm px-20 py-10 outline-none text-blue-500 placeholder:text-blue-400"
          type="text"
          id="input" placeholder="Enter Your To Do Value"
        />
        <div class="flex justify-center"><div class="mt-20 mb-20 bg-red-500 max-w-80 w-full py-2 px-2 rounded-sm"><button onclick="getsub()" class="bg-blue-400 px-15 py-10 rounded-sm max-w-80 w-full">Submit</button></div></div>
        <div id="todolist" onclick="todo()" class="flex flex-col-reverse gap-20"></div>
      </div>
    </div>

    <script>
      const input = document.getElementById("input");
      const todolist = document.getElementById("todolist");

      function getsub() {
        if (input.value === "") {
          todolist.innerHTML = `<span class="text-blue-400 flex justify-center">Enter Your to do</span>`;
        } else {
          let todo = input.value;
          todolist.innerHTML += `
          <div onclick="this.remove()" class="bg-blue-500 py-1 px-1 rounded-sm"><div class="flex items-center gap-5 bg-red-400 text-white px-4 py-2 rounded cursor-pointer">
            <i class="fa-solid fa-arrow-right text-white"></i>
            <span class="text-white font-medium mb-5">${todo}</span>
          </div></div>
        `;
          input.value = "";
        }
      }

      
    </script>
  </body>
</html>
