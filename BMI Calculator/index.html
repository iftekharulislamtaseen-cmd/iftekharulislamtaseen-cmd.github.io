<!doctype html>
<html>
  <head>
    <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="src/output.css" />
    <title>Hello, World!</title>
    <style>
      .flexi {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
    </style>
  </head>
  <body class="bg-black">
    <div
      class="bg-linear-65 from-purple-500 to-pink-500 max-w-360  mx-auto px-2 pt-1 pb-2 rounded-10br mt-50"
    >
      <div
        class="bg-black max-w-380 w-full flex flex-col gap-20 justify-center items-center rounded-10br py-20"
      >
        <div class="text-center">
          <label class="text-[blue] font-semibold text-[18px]" for=""
            >Height</label
          >
          <input
            class="[appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none mt-10 max-w-310 w-full border border-blue-700 py-10 pl-20 outline-0 text-blue-700 placeholder:text-blue-600 rounded-10br"
            type="number"
            id="height"
            placeholder="Enter Your Height"
          />
        </div>
        <div class="text-center">
          <label class="text-[blue] font-semibold text-[18px]" for=""
            >Weight</label
          >
          <input
            class="[appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none mt-10 max-w-310 w-full border border-blue-700 py-10 pl-20 outline-0 text-blue-700 placeholder:text-blue-600 rounded-10br"
            type="number"
            id="weight"
            placeholder="Enter Your Weight"
          />
        </div>
        <div>
          <button class="bg-blue-700 pt-5 pb-8 px-15 rounded-10br" onclick="GetResult()">Submit</button>
        </div>
        <div
          class="mb-10 border border-red-400 rounded-2xl bg-linear-to-r from-cyan-500 to-emerald-500 text-slate-900 max-w-300 w-full px-30 py-10"
        >
        <div>
        <div class="text-center pb-10 text-[18px] font-medium">Result</div>
        <div class="border border-green-600 rounded-20br px-20 py-10 h-60 flex flex-col justify-center mb-10">
            <div class="" id="placeholder">your Result here</div>
            <div id="result"></div>
            <div id="status"></div>
        </div>
        </div>
          <div>
            <ul class="font-semibold">
              <li>Below 18.5 = Underweight</li>
              <li>18.5 – 24.9 = Normal</li>
              <li>25.0 – 29.9 = overweight</li>
              <li>30.0 – upper = bese</li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <script>
      const height = document.getElementById("height");
      const weight = document.getElementById("weight");
      const result = document.getElementById("result");
      const status = document.getElementById("status");
      const placeholder = document.getElementById("placeholder");

      function GetResult() {
        
        status.innerHTML = ""


        if (height.value === "" || weight.value === "") {
          result.innerHTML = `<span>please input a number</span>`;
        } else if (height.value < 0 || weight.value < 0) {
          result.innerHTML = `<span>please input a valid number</span>`;
        } else {
          let hvalue = Number(height.value);
          let wvalue = Number(weight.value);

          let results = (wvalue / hvalue / hvalue) * 10000;
          placeholder.style.display = "none"
          result.innerHTML = `<span>result is : ${results.toFixed(2)}</span>`;
          height.value = "";
          weight.value = "";
          

          if (results < 18.5) {
            status.innerHTML = `<span>Status is : Underweight</span>`;
            status.style.color = "blue";
            result.style.color = "blue";
          } else if (results <= 24.9) {
            status.innerHTML = `<span>Status is : Normal</span>`;
            status.style.color = "green";
            result.style.color = "green";
          } else if (results <= 29.9) {
            status.innerHTML = `<span>Status is : Overweight</span>`;
            status.style.color = "orange";
            result.style.color = "orange";
          } else {
            status.innerHTML = `<span>Status is : Obese</span>`;
            status.style.color = "red";
            result.style.color = "red";
            
          }
        }

      }
    </script>
  </body>
</html>
